<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Vegan Chocolate Chip Cookies</title>
    <meta name="description" content="Get in touch with questions or feedback about the vegan chocolate chip cookie recipe.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Space+Mono&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="index.html">Vegan Chocolate Cookies</a>
            <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">☰ Menu</button>
            <nav class="site-nav" id="site-nav" aria-label="Primary">
                <ul>
                    <li><a href="index.html">Guide</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contact-shell">
            <div class="contact-card">
                <h2>Questions or Feedback</h2>
                <p class="lede">Made the recipe? Got a substitution question? Send a note below and I'll get back to you.</p>

                <form>
                    <div class="field-grid">
                        <div class="field">
                            <label for="full-name">Name</label>
                            <input type="text" id="full-name" name="full-name" autocomplete="name" required>
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="phone">Phone <span class="optional">(optional)</span></label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="field">
                        <label for="comment">Comments or Questions</label>
                        <textarea id="comment" name="comment" required></textarea>
                    </div>

                    <div class="form-action">
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; Baked with patience.</p>
    </footer>

    
</body>
</html>
